name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exact-deduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s tests
      - name: Verify manifest and exact deduction
        run: python3 verify_release.py
